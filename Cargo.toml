[package]
name = "cfrs"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "A Cloudflare Tunnel client in Rust: quick tunnels, named tunnels, QUIC and HTTP/2 edge transports, unix-socket and TCP origins"
license = "0BSD"
repository = "https://github.com/talaria0101/cfrs"
readme = "README.md"
keywords = ["cloudflare", "tunnel", "quick-tunnel", "trycloudflare", "argotunnel", "quic"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
# The Cloudflare quick-tunnel provisioning API is a plain JSON POST.
# `ureq` is deliberately used over a full async HTTP client: this call is a
# single synchronous request/response and needs no connection pooling.
# Pinned to the 2.x API; 3.x changed the request builder shape.
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SSH remote forwarding, for environments where the Cloudflare tunnel edge is
# not reachable and a TCP relay over port 443 is.
russh = "0.64"
# QUIC transport for the Cloudflare edge (ALPN "argotunnel", SNI quic.cftunnel.com).
quinn = { version = "0.11", default-features = false, features = [
    "runtime-tokio",
    "rustls-ring",
    "log",
] }
# HTTP/2 transport for the Cloudflare edge (SNI h2.cftunnel.com, empty ALPN).
h2 = "0.4"
http = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "time",
    "fs",
    "sync",
    "signal",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
    "logging",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
rustls-pemfile = "2"
rustls-pki-types = "1"
# DNS: resolve the edge SRV record, and serve DNS when asked.
hickory-resolver = { version = "0.24", default-features = false, features = [
    "tokio-runtime",
    "system-config",
] }
# Config file parsing, matching cloudflared's config.yml shape.
serde_yaml = "0.9"
# Terminal QR code for the public URL.
qrcode = { version = "0.14", default-features = false }
# The rest of this crate reports errors with its own `FeatureError` and
# `std::io::Error`. The `vnet` module (ported from the reference implementation
# of the userspace network) reports them with `anyhow`, which is left as-is
# rather than rewritten: its error paths span a TCP state machine and a packet
# codec, and the context chain is the point.
anyhow = "1"
tracing = "0.1"
# Userspace virtual network: a real TCP/IP stack over an in-process link, so a
# program can bind and connect 10.66.0.x without an AF_INET syscall. Pinned
# exactly, because smoltcp's device and wire APIs are not covered by semver.
smoltcp = { version = "=0.11.0", default-features = false, features = [
    "std",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
    "socket-udp",
] }
# AtomicWaker: the stack's poll loop parks on it instead of spinning.
futures = { version = "0.3", default-features = false, features = ["std"] }
# getrandom-backed OS entropy for the ephemeral SSH key. Pinned to the same
# ssh-key line russh uses so the CryptoRng trait bounds unify.
ssh-key = { version = "0.7.0-rc.11", features = ["getrandom"] }
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
# The shim tests compile C programs and run them under LD_PRELOAD.
tempfile = "3"

[profile.release]
opt-level = 2